name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-desktop:
    name: Desktop ${{ matrix.platform_id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform_id: linux-x64
          - runner: ubuntu-24.04-arm
            platform_id: linux-arm64
          - runner: windows-latest
            platform_id: windows-x64
          - runner: macos-15-intel
            platform_id: macos-x64
          - runner: macos-latest
            platform_id: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version=//p' gradle.properties)"
          fi
          echo "RWX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build platform JAR and jpackage image
        shell: bash
        run: |
          ./gradlew --no-daemon \
            -Pversion="$RWX_VERSION" \
            -PtargetPlatform=${{ matrix.platform_id }} \
            :desktop:test \
            :desktop:platformFatJar \
            :desktop:packageDesktopDistribution

      - name: Verify Windows launcher uses bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/test-windows-bundled-runtime.ps1 `
            -ImagePath desktop/build/jpackage/image/windows-x64/RWX `
            -ExternalJavaHome $env:JAVA_HOME

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: RWX-${{ matrix.platform_id }}
          path: desktop/build/distributions/RWX-*-${{ matrix.platform_id }}-desktop.zip
#            desktop/build/libs/RWX-*-${{ matrix.platform_id }}.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: RWX-${{ matrix.platform_id }}-logs
          path: |
            desktop/build/jpackage/**
            desktop/build/reports/**
            build/reports/**
            hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 14

  build-universal-jar:
    name: Universal desktop JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version=//p' gradle.properties)"
          fi
          echo "RWX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build universal JAR
        run: ./gradlew --no-daemon -Pversion="$RWX_VERSION" :desktop:multiPlatformFatJar

      - name: Upload universal JAR
        uses: actions/upload-artifact@v6
        with:
          name: RWX-universal-jar
          path: desktop/build/libs/RWX-*-all.jar
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android release
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version=//p' gradle.properties)"
          fi
          echo "RWX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate Android signing configuration
        shell: bash
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_KEYSTORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

      - name: Restore Android signing keystore
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/rwx-android-signing.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          ./gradlew --no-daemon \
            -Pversion="$RWX_VERSION" \
            :android:assembleRelease

      - name: Stage Android artifacts
        shell: bash
        run: |
          mkdir -p android-artifacts
          while IFS= read -r apk; do
            name="$(basename "$apk")"
            cp "$apk" "android-artifacts/RWX-$RWX_VERSION-$name"
          done < <(find android/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: RWX-android
          path: android-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: RWX-android-logs
          path: |
            android/build/outputs/logs/**
            android/build/reports/**
            android/build/outputs/mapping/**
            build/reports/**
            hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Android signing keystore
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_FILE"

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-desktop
      - build-universal-jar
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version from tag
        run: echo "RWX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: RWX-*
          merge-multiple: true

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_MESSAGE=$(git cat-file tag "$GITHUB_REF_NAME" 2>/dev/null | sed '1,/^$/d' || echo "")
          AUTO_NOTES=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              --jq '.body')
          if [ -z "$TAG_MESSAGE" ]; then
            echo "$AUTO_NOTES" > release_notes.md
          else
            printf "%s\n\n---\n\n%s" "$TAG_MESSAGE"  "$AUTO_NOTES" > release_notes.md
          fi

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RWX_VERSION }}
          name: ${{ env.RWX_VERSION }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release_notes.md
          artifacts: |
            release-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
