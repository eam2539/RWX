name: P2P GitHub Discovery Dist

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'p2p-github-gists.json'
      - 'tools/p2p-github-dist.js'
      - '.github/workflows/p2p-github-dist.yml'

concurrency:
  group: p2p-github-discovery-dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: p2p-dist
          path: p2p-dist-worktree

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build P2P discovery index
        working-directory: p2p-dist-worktree
        run: node tools/p2p-github-dist.js

      - name: Publish P2P discovery index
        working-directory: p2p-dist-worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rooms.json
          if git diff --cached --quiet; then
            echo "P2P discovery index unchanged"
          else
            git commit -m "Update P2P discovery dist"
            git push origin HEAD:p2p-dist
          fi
