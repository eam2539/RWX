name: Deploy

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            platform_id: linux-x64
            artifact_name: RWX-linux-x64-desktop
            gradle_max_workers: 4
          - name: Windows x64
            runner: windows-latest
            platform_id: windows-x64
            artifact_name: RWX-windows-x64-desktop
            gradle_max_workers: 4
          - name: macOS x64
            runner: macos-26-intel
            platform_id: macos-x64
            artifact_name: RWX-macos-x64-desktop
            gradle_max_workers: 4
          - name: macOS arm64
            runner: macos-latest
            platform_id: macos-arm64
            artifact_name: RWX-macos-arm64-desktop
            gradle_max_workers: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libfreetype-dev patchelf

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake freetype

      - name: Build & install libRocket (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libRocket/libRocket.git /tmp/libRocket
          cmake -S /tmp/libRocket/Build -B /tmp/libRocket/Build/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_SAMPLES=OFF \
            -Wno-dev
          cmake --build /tmp/libRocket/Build/build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          mkdir -p /tmp/libRocket/Build/lib
          cp /tmp/libRocket/Build/build/libRocket*.a /tmp/libRocket/Build/lib/
          echo "LIBROCKET_ROOT=/tmp/libRocket" >> "$GITHUB_ENV"

      - name: Build & install libRocket (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install freetype:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          git clone --depth 1 https://github.com/libRocket/libRocket.git C:\libRocket
          cmake -S C:\libRocket\Build -B C:\libRocket\Build\build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_SAMPLES=OFF `
            -Wno-dev `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build C:\libRocket\Build\build --config Release
          New-Item -ItemType Directory -Force -Path C:\libRocket\Build\Lib
          Copy-Item C:\libRocket\Build\build\Release\*.lib C:\libRocket\Build\Lib\
          echo "LIBROCKET_ROOT=C:\libRocket" >> $env:GITHUB_ENV

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build desktop package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=${{ matrix.gradle_max_workers }} :desktop:packageDesktopDistribution 2>&1 | tee desktop-package.log

      - name: Build desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --max-workers=${{ matrix.gradle_max_workers }} :desktop:packageDesktopDistribution 2>&1 | Tee-Object -FilePath desktop-package.log

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/build/distributions/*-${{ matrix.platform_id }}-desktop.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            desktop-package.log
            desktop/build/jpackage/**
            desktop/build/reports/**
            hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 14

  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    environment: ci
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/android-signing.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Restore Android signing keystore
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > "$KEYSTORE_FILE"

      - name: Build Android release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=4 :android:assembleRelease 2>&1 | tee android-apk.log

      - name: Stage Android APK
        run: |
          set -euo pipefail
          mkdir -p android-artifacts
          cp android/build/outputs/apk/release/*-release*.apk android-artifacts/RWX-android-release.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RWX-android-apk
          path: android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RWX-android-apk-logs
          path: |
            android-apk.log
            android/build/reports/**
            android/build/outputs/logs/**
            hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Android signing keystore
        if: always()
        run: rm -f "$KEYSTORE_FILE"

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-desktop
      - build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: RWX-*-desktop
          merge-multiple: true

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: RWX-android-apk
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.zip *.apk > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          assets=(release-artifacts/*.zip release-artifacts/*.apk release-artifacts/SHA256SUMS.txt)

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$repo" --generate-notes --verify-tag
          fi
